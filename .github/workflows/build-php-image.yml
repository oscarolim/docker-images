name: Build PHP images

on:
  # Weekly rebuild to pick up PHP patch releases and Debian security fixes
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  # Rebuild when the image definition changes
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-php-image.yml
  # "Run workflow" button for an urgent security fix
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: piwigo-php

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure on one version must not block the other
      matrix:
        php: ["8.1", "8.3"]
    concurrency:
      group: build-php-${{ matrix.php }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and date tag
        id: vars
        run: |
          # ghcr.io requires lowercase names; owner names may contain capitals
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true      # always fetch the newest php:<version>-fpm-bookworm base
          no-cache: true  # always re-run apt upgrade and fetch the newest extension installer
          push: true
          platforms: linux/amd64 # add ,linux/arm64 for a Raspberry Pi / ARM host
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ matrix.php }}
            ${{ steps.vars.outputs.image }}:${{ matrix.php }}-${{ steps.vars.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=PHP-FPM ${{ matrix.php }} with extensions for Piwigo
